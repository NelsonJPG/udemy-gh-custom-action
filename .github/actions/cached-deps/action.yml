name: 'Get & Cache Dependencies'
description: 'Get the dependencies (via npm) and cache them for future use'
inputs:
  caching:
    description: 'Check if the caching is true or not. If true, the dependencies will be cached for future use.'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Cache dependencies
      if: inputs.caching == 'true'
      id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      if: inputs.caching != 'true' || steps.cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash